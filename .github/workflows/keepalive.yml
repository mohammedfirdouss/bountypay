# Render's free tier restarts the demo after it sits idle, which loses the SQLite file, so ping it to keep it awake.
name: Keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors https://bountypay.onrender.com/api/health
